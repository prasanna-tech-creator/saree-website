<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="Admin dashboard for Tharinayambyaisha saree boutique." />
    <title>Tharinayambyaisha | Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=2026-10-22" />
    <link rel="stylesheet" href="pricing.css?v=2026-10-22" />
    <style>
      :root {
        --wine: #4d1727;
        --wine2: #6e2639;
        --gold: #b58a49;
        --ink: #2b2021;
        --muted: #827576;
        --ivory: #faf6ef;
        --line: #e8ded2;
        --white: #fffdf9;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: var(--ivory);
        color: var(--ink);
        font-family: "DM Sans", sans-serif;
      }

      a { color: inherit; text-decoration: none; }
      button, input, textarea, select { font: inherit; }

      .admin-page {
        min-height: 100vh;
        background:
          radial-gradient(circle at top left, rgba(181, 138, 73, 0.08), transparent 28%),
          linear-gradient(180deg, #f8f0ea 0%, #f6f1eb 100%);
      }

      .admin-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 22px 5%;
        background: rgba(255, 253, 249, 0.9);
        border-bottom: 1px solid var(--line);
        position: sticky;
        top: 0;
        z-index: 10;
      }

      .admin-brand {
        display: flex;
        flex-direction: column;
        gap: 5px;
        min-width: 200px;
      }

      .admin-brand-name {
        font-family: "Playfair Display", serif;
        font-size: 1.8rem;
        letter-spacing: 0.15em;
        color: var(--wine);
        text-transform: lowercase;
      }

      .admin-brand-tag {
        font-size: 9px;
        letter-spacing: 0.08em;
        color: #8e765f;
        text-transform: uppercase;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 12px 18px;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 700;
        transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        cursor: pointer;
      }

      .button:hover { transform: translateY(-1px); }

      .button-dark {
        background: var(--wine);
        color: #fff9f1;
        border-color: var(--wine);
      }

      .button-dark:hover {
        box-shadow: 0 10px 24px rgba(77, 23, 39, 0.18);
      }

      .button.ghost {
        background: transparent;
        color: var(--wine);
        border-color: rgba(77, 23, 39, 0.35);
      }

      .button.danger {
        background: #a63745;
        color: #fff;
        border-color: #a63745;
      }

      .full-button { width: 100%; }

      .admin-shell {
        max-width: 1260px;
        margin: 0 auto;
        padding: 42px 5% 64px;
      }

      .panel { display: none; }
      .panel.visible { display: block; }

      .auth-card,
      .dashboard-panel,
      .catalogue-panel,
      .product-panel {
        background: rgba(255, 255, 255, 0.72);
        border: 1px solid var(--line);
        border-radius: 26px;
        box-shadow: 0 18px 48px rgba(36, 15, 28, 0.04);
      }

      .auth-card {
        max-width: 560px;
        margin: 0 auto;
        padding: 40px 34px;
      }

      .eyebrow {
        margin: 0 0 16px;
        font-weight: 700;
        letter-spacing: 0.18em;
        font-size: 10px;
        color: var(--gold);
        text-transform: uppercase;
      }

      h1, h2, h3 {
        margin: 0 0 12px;
        font-family: "Playfair Display", serif;
        font-weight: 500;
        color: var(--wine);
      }

      h1 {
        font-size: clamp(2.2rem, 3vw, 3.3rem);
      }

      .subtitle {
        margin: 0 0 26px;
        color: var(--muted);
        line-height: 1.7;
      }

      .stacked-form {
        display: grid;
        gap: 18px;
      }

      .field-group {
        display: grid;
        gap: 8px;
      }

      .field-group label {
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: var(--ink);
      }

      .field-group input,
      .field-group textarea,
      .field-group select {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: #fffdfb;
        padding: 12px 14px;
        color: var(--ink);
      }

      .field-group textarea {
        min-height: 120px;
        resize: vertical;
      }

      .status-message {
        min-height: 20px;
        margin-top: 14px;
        font-size: 13px;
        color: var(--muted);
      }

      .status-message.error { color: #9a2e3d; }
      .status-message.success { color: #1c6d4a; }

      .dashboard-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 26px;
      }

      .dashboard-header h2 {
        margin: 0;
        font-size: clamp(2rem, 2.8vw, 3rem);
      }

      .dashboard-grid {
        display: grid;
        grid-template-columns: 420px 1fr;
        gap: 24px;
      }

      .admin-image-box {
        display: grid;
        gap: 12px;
      }

      .image-preview {
        width: 100%;
        max-width: 220px;
        aspect-ratio: 4 / 5;
        object-fit: cover;
        border-radius: 18px;
        border: 1px solid var(--line);
        background: #f3ece6;
        display: block;
      }

      .product-panel,
      .catalogue-panel {
        padding: 24px;
      }

      .panel-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 18px;
      }

      .panel-heading h3 {
        margin: 0;
        font-size: 2rem;
      }

      .product-form {
        display: grid;
        gap: 16px;
      }

      .product-form .two-col {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      .action-row {
        display: flex;
        justify-content: flex-end;
        gap: 12px;
        margin-top: 6px;
      }

      .catalog-list {
        display: grid;
        gap: 18px;
        margin-top: 16px;
      }

      .catalog-item {
        display: grid;
        grid-template-columns: 90px 1fr auto;
        gap: 16px;
        align-items: center;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.72);
      }

      .catalog-item img {
        width: 90px;
        height: 110px;
        object-fit: cover;
        border-radius: 14px;
        background: #f3ece6;
      }

      .catalog-meta {
        display: grid;
        gap: 4px;
      }

      .catalog-meta strong {
        color: var(--wine);
        letter-spacing: 0.08em;
        font-size: 11px;
        text-transform: uppercase;
      }

      .catalog-meta span {
        font-weight: 600;
        color: var(--ink);
      }

      .catalog-meta small {
        color: var(--muted);
      }

      .catalog-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .helper-text {
        margin: 0;
        padding: 18px 12px;
        border: 1px dashed var(--line);
        border-radius: 12px;
        color: var(--muted);
      }

      @media (max-width: 960px) {
        .dashboard-grid { grid-template-columns: 1fr; }
      }

      @media (max-width: 640px) {
        .admin-header {
          flex-direction: column;
          align-items: flex-start;
        }

        .admin-shell {
          padding-left: 16px;
          padding-right: 16px;
        }

        .auth-card,
        .product-panel,
        .catalogue-panel {
          padding: 18px 14px;
        }

        .dashboard-header {
          flex-direction: column;
          align-items: flex-start;
        }

        .product-form .two-col { grid-template-columns: 1fr; }

        .catalog-item {
          grid-template-columns: 72px 1fr;
        }

        .catalog-actions {
          grid-column: 1 / -1;
          justify-content: flex-start;
        }
      }
    </style>
  </head>
  <body class="admin-page">
    <header class="admin-header">
      <a class="admin-brand" href="index.html">
        <span class="admin-brand-name">tharinayambyaisha</span>
        <span class="admin-brand-tag">Boutique administration</span>
      </a>
      <a class="button button-dark" href="index.html">Back to storefront</a>
    </header>

    <main class="admin-shell">
      <section id="loginPanel" class="panel visible">
        <div class="auth-card">
          <p class="eyebrow">Boutique access</p>
          <h1>Admin login</h1>
          <p class="subtitle">Use the boutique credentials to manage the saree catalogue and product details.</p>

          <form id="loginForm" class="stacked-form">
            <div class="field-group">
              <label for="username">Username</label>
              <input id="username" name="username" type="text" autocomplete="username" required />
            </div>

            <div class="field-group">
              <label for="password">Password</label>
              <input id="password" name="password" type="password" autocomplete="current-password" required />
            </div>

            <button type="submit" class="button button-dark full-button">Log in <span>→</span></button>
          </form>

          <div id="loginStatus" class="status-message" role="status" aria-live="polite"></div>
        </div>
      </section>

      <section id="dashboardPanel" class="panel">
        <div class="dashboard-header">
          <div>
            <p class="eyebrow">Catalogue management</p>
            <h2>Admin dashboard</h2>
          </div>
          <button id="logoutButton" type="button" class="button ghost">Log out</button>
        </div>

        <div class="dashboard-grid">
          <aside class="product-panel">
            <div class="panel-heading">
              <h3 id="formTitle">Add new saree</h3>
            </div>

            <form id="productForm" class="product-form">
              <div class="field-group">
                <label for="productId">Product ID</label>
                <input id="productId" name="id" type="text" placeholder="THA-099" />
              </div>

              <div class="field-group">
                <label for="productName">Name</label>
                <input id="productName" name="name" type="text" required />
              </div>

              <div class="field-group">
                <label for="productTagline">Tagline</label>
                <input id="productTagline" name="tagline" type="text" required />
              </div>

              <div class="two-col">
                <div class="field-group">
                  <label for="productPrice">Selling price (₹)</label>
                  <input id="productPrice" name="price" type="number" min="1" step="1" inputmode="numeric" />
                </div>
                <div class="field-group">
                  <label for="productOriginalPrice">Original price (₹, optional)</label>
                  <input id="productOriginalPrice" name="originalPrice" type="number" min="1" step="1" inputmode="numeric" />
                </div>
              </div>

              <div class="field-group">
                <label for="productFabric">Type / material</label>
                <input id="productFabric" name="fabric" type="text" placeholder="e.g. Soft silk" />
              </div>

              <div class="field-group admin-image-box">
                <label for="productImage">Image path or upload</label>
                <input id="productImage" name="image" type="text" required placeholder="assets/images/tha-001.jpeg" />
                <input id="productImageUpload" name="imageUpload" type="file" accept="image/*" capture="environment" />
                <img id="productImagePreview" class="image-preview" alt="Product preview" hidden />
              </div>

              <div class="two-col">
                <div class="field-group">
                  <label for="productColor">Colour</label>
                  <input id="productColor" name="color" type="text" required />
                </div>

                <div class="field-group">
                  <label for="productOccasion">Occasion</label>
                  <input id="productOccasion" name="occasion" type="text" required />
                </div>
              </div>

              <div class="field-group">
                <label for="productBody">Body</label>
                <input id="productBody" name="body" type="text" required />
              </div>

              <div class="field-group">
                <label for="productBorder">Border</label>
                <input id="productBorder" name="border" type="text" required />
              </div>

              <div class="field-group">
                <label for="productLook">Look</label>
                <input id="productLook" name="look" type="text" required />
              </div>

              <div class="field-group">
                <label for="productDescription">Description</label>
                <textarea id="productDescription" name="description" required></textarea>
              </div>

              <div class="action-row">
                <button id="cancelEdit" type="button" class="button ghost">Clear</button>
                <button type="submit" class="button button-dark">Save saree</button>
              </div>

              <div id="productStatus" class="status-message" role="status" aria-live="polite"></div>
            </form>
          </aside>

          <section class="catalogue-panel">
            <div class="panel-heading">
              <h3>Collection</h3>
            </div>
            <div id="catalogList" class="catalog-list"></div>
          </section>
        </div>
      </section>
    </main>

    <script src="products.js?v=2026-10-22-price-tags"></script>
    <script src="admin.js?v=2026-10-22-price-tags"></script>
  </body>
</html>
